spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_UPLOAD_BYTES:10485760}B
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_REQUEST_BYTES:11534336}B

spring.flyway.schemas=nexaops
spring.flyway.default-schema=nexaops
spring.flyway.create-schemas=true

nexaops.ai-service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
nexaops.ai-service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:2s}
nexaops.ai-service.read-timeout=${AI_SERVICE_READ_TIMEOUT:4s}
nexaops.ai-service.generation-model=${OLLAMA_GENERATION_MODEL:qwen3:4b}
nexaops.ai-service.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
nexaops.ai-service.document-extraction-read-timeout=${AI_SERVICE_EXTRACTION_READ_TIMEOUT:60s}
nexaops.ai-service.document-embedding-read-timeout=${AI_SERVICE_EMBEDDING_READ_TIMEOUT:180s}
nexaops.ai-service.embedding-batch-size=${AI_SERVICE_EMBEDDING_BATCH_SIZE:32}
nexaops.ai-service.retrieval-read-timeout=${AI_SERVICE_RETRIEVAL_READ_TIMEOUT:180s}
nexaops.ai-service.rag-read-timeout=${AI_SERVICE_RAG_READ_TIMEOUT:300s}
nexaops.retrieval.max-query-length=${RETRIEVAL_QUERY_MAX_CHARS:2000}
nexaops.retrieval.default-top-k=${RETRIEVAL_DEFAULT_TOP_K:5}
nexaops.retrieval.max-top-k=${RETRIEVAL_MAX_TOP_K:10}
nexaops.documents.max-upload-bytes=${DOCUMENT_MAX_UPLOAD_BYTES:10485760}
nexaops.documents.chunk-size=${DOCUMENT_CHUNK_SIZE:1200}
nexaops.documents.chunk-overlap=${DOCUMENT_CHUNK_OVERLAP:150}

nexaops.admin.username=${NEXAOPS_ADMIN_USERNAME:}
nexaops.admin.password=${NEXAOPS_ADMIN_PASSWORD:}
nexaops.cors.allowed-origins=${NEXAOPS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
